name: Deploy site

# Publishes site/ to GitHub Pages. Needs Settings -> Pages -> Source: GitHub Actions.
#
# The weekly job commits with the built-in token, and such commits don't
# trigger other workflows, so this also runs when the weekly job finishes.
on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_run:
    workflows: ["Weekly rankings"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
