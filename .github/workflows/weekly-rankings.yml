name: Weekly rankings

# Tuesday after Monday Night Football (times are UTC; 15:00 is 10-11am Eastern).
# The Tuesday-evening and Wednesday runs are retries: if the week isn't
# finished or nflverse hasn't published play-by-play yet, `rank` exits with an
# error and the next run picks it up.
#
# Saturday re-runs with the final injury reports (published Wednesday-Friday)
# and the latest projected starters. It doesn't add any games, so only "this
# week" ratings, ranks and next week's lines can move.
#
# A run with nothing new commits nothing.
on:
  schedule:
    - cron: "0 15 * * 2"
    - cron: "0 21 * * 2"
    - cron: "0 15 * * 3"
    - cron: "0 15 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-rankings
  cancel-in-progress: false

jobs:
  rank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Restore nflverse data cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: nflverse-${{ github.run_id }}
          restore-keys: nflverse-

      - run: pip install -r requirements.txt

      - run: python -m pytest -q

      - name: Rank
        # Without the secret the team notes fall back to templates.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m powerrank --refresh rank

      - name: Commit if the rankings changed
        run: |
          if git diff --quiet -I '"generated":' -- site/rankings.json; then
            echo "No change."
            exit 0
          fi
          week=$(python -c "import json; print(json.load(open('site/rankings.json'))['through_week'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add site/rankings.json
          if [ "$(date -u +%u)" = "6" ]; then
            git commit -m "Rankings through week ${week}, updated with injury reports"
          else
            git commit -m "Rankings through week ${week}"
          fi
          git push
